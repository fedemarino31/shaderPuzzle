<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#060910" />
		<title>ShadersPuzzle Game</title>
		<link rel="stylesheet" href="./src/game.css" />
	</head>
	<body>
		<div id="gameViewport" aria-hidden="true"></div>
		<main id="menu" class="menu">
			<h1>Choose a material</h1>
			<div id="materialGrid" class="material-grid" role="radiogroup" aria-label="Material"></div>
			<div class="menu-actions">
				<button id="enterAR" class="enter-ar" type="button" disabled>Loading…</button>
				<p id="menuStatus" class="menu-status"></p>
			</div>
		</main>
		<div id="gameError" class="game-error" hidden></div>
		<script type="module" src="./src/gameMain.js"></script>
	</body>
</html>
