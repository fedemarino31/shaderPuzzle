<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ShadersPuzzle Shader Editor</title>
		<script type="module" crossorigin src="./assets/shaderEditor-Bl7_ZGx-.js"></script>
		<link rel="modulepreload" crossorigin href="./assets/OrbitControls-Br1fpmVG.js">
		<link rel="modulepreload" crossorigin href="./assets/RoomEnvironment-Q56mtrNv.js">
		<link rel="modulepreload" crossorigin href="./assets/tweakpane-Bt2fMxNb.js">
		<link rel="modulepreload" crossorigin href="./assets/pulseWaveAssets-DQ_Qli4R.js">
		<link rel="stylesheet" crossorigin href="./assets/shaderEditor-BUzd523i.css">
	</head>
	<body>
		<div id="shaderApp">
			<header class="shader-topbar">
				<a class="home-link" href="./index.html" title="All tools">←</a>
				<div class="brand"><span class="brand-mark shader-mark"></span><strong>ShadersPuzzle</strong><span>Shader Editor</span></div>
				<div class="view-switch" role="group" aria-label="Preview mode"><button type="button" data-view="2D">2D Slice</button><button type="button" data-view="3D" class="active">3D Surface</button></div>
				<div id="backendBadge" class="backend-badge">Initializing renderer…</div>
			</header>
			<main class="shader-main">
				<div id="shaderViewport" aria-label="Procedural shader preview"></div>
				<div class="viewport-label"><span id="viewLabel">3D PBR surface</span><small id="coordinateLabel">UVW domain</small></div>
				<aside id="shaderPanel"></aside>
				<div id="shaderError" class="shader-error" hidden></div>
			</main>
			<footer class="shader-status"><div id="shaderStatus">Preparing TSL shader…</div><div>Orbit: drag · Pan: right drag · Zoom: wheel</div></footer>
		</div>
	</body>
</html>
